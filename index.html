<!doctype html><html lang="pt-PT"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><title>Bruno Fitness V3</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#111827;padding-bottom:80px}
header{background:linear-gradient(135deg,#111827,#1e3a8a);color:white;padding:18px;position:sticky;top:0;z-index:5}
main{max-width:720px;margin:auto;padding:14px}.screen{display:none}.screen.active{display:block}
.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:15px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#f8fafc;padding:12px;border-radius:14px}
.metric b{display:block;font-size:21px}small,.muted{color:#64748b}button{border:0;border-radius:11px;padding:10px 12px;background:#2563eb;color:white;font-weight:650}
button.alt{background:#eef2ff;color:#1e40af}button.gray{background:#e5e7eb;color:#111827}.row{display:flex;gap:8px;flex-wrap:wrap}
input,select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;margin:4px 0 8px;box-sizing:border-box}
label{font-size:12px;color:#64748b;font-weight:650}.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:#2563eb}
.exercise{border:1px solid #e5e7eb;border-radius:15px;padding:12px;margin:10px 0}.exercise img{width:100%;height:150px;object-fit:cover;border-radius:11px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:7px;z-index:10}
.bottom button{background:none;color:#64748b;font-size:11px;padding:6px}.bottom button.active{color:#2563eb}
.timer{text-align:center;font-size:30px;font-weight:800}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{padding:8px 2px;text-align:center;border:1px solid #e5e7eb;border-radius:8px;font-size:12px}.day.train{background:#dcfce7}
</style></head><body>
<header><b>Bruno Fitness V3</b><div style="opacity:.8;font-size:13px">Treino • Nutrição • Evolução</div></header>
<main><section id="home" class="screen active"></section><section id="training" class="screen"></section><section id="nutrition" class="screen"></section><section id="progress" class="screen"></section><section id="profile" class="screen"></section></main>
<nav class="bottom"><button data-s="home">🏠<br>Início</button><button data-s="training">🏋️<br>Treino</button><button data-s="nutrition">🍽️<br>Nutrição</button><button data-s="progress">📈<br>Progresso</button><button data-s="profile">👤<br>Perfil</button></nav>
<script>
const K="BFV3",D={profile:{name:"Bruno",age:34,height:174,weight:88.2,waist:95,target:80,targetWaist:89,cal:2200,protein:175,fat:65,carbs:220},water:0,meals:[],history:[],measure:[{date:new Date().toISOString().slice(0,10),weight:88.2,waist:95}],train:[],events:[],
workouts:{Push:[["Supino plano com barra",4,"6–8"],["Supino inclinado com halteres",3,"8–10"],["Chest press",3,"10–12"],["Shoulder press",3,"8–10"],["Elevações laterais",3,"12–15"],["Tríceps na polia",3,"10–12"]],
Pull:[["Lat pulldown",4,"6–10"],["Remada sentada",3,"8–10"],["Remada apoiada",3,"8–12"],["Puxada unilateral",2,"10–12"],["Reverse fly",3,"12–15"],["Curl bíceps",3,"8–12"]],
Legs:[["Agachamento / Hack squat",4,"6–8"],["Leg press",3,"8–12"],["Peso morto romeno",3,"8–10"],["Leg curl",3,"10–12"],["Leg extension",2,"12–15"],["Gémeos",4,"10–15"],["Cable crunch",3,"10–15"]],
Upper:[["Supino inclinado",3,"6–8"],["Lat pulldown",3,"6–10"],["Chest press",3,"8–12"],["Remada máquina",3,"8–12"],["Elevações laterais",3,"12–15"],["Curl bíceps",3,"10–12"],["Tríceps na polia",3,"10–12"]],
Lower:[["Hack squat / Agachamento",3,"8–10"],["Peso morto romeno",3,"8–10"],["Leg press",3,"10–12"],["Leg curl",3,"10–15"],["Leg extension",2,"12–15"],["Gémeos",4,"12–15"],["Prancha",3,"30–60 s"]]}}
let d=JSON.parse(localStorage.getItem(K)||"null")||D,sel="Push",timer=null,sec=0;
const save=()=>localStorage.setItem(K,JSON.stringify(d)),esc=x=>String(x).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function nav(s){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(s).classList.add("active");render(s)}
document.querySelectorAll(".bottom button").forEach(b=>b.onclick=()=>nav(b.dataset.s));
function img(){return "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1a?auto=format&fit=crop&w=900&q=75"}
function renderHome(){let p=d.profile;home.innerHTML=`<h2>Olá, ${esc(p.name)} 👋</h2><div class=card><b>Objetivo: recomposição corporal</b><p class=muted>Meta: ${p.target} kg • cintura ${p.targetWaist} cm</p><div class=grid><div class=metric><b>${p.weight} kg</b><small>Peso atual</small></div><div class=metric><b>${p.waist} cm</b><small>Cintura</small></div><div class=metric><b>${d.history.length}</b><small>Treinos</small></div><div class=metric><b>${d.water} ml</b><small>Água hoje</small></div></div></div><div class=card><div class=row><button onclick="water(100)">+100 ml</button><button onclick="water(250)">+250 ml</button><button onclick="water(500)">+500 ml</button><button class=gray onclick="d.water=0;save();renderHome()">Reset</button></div></div>`}
function water(n){d.water+=n;save();renderHome()}
function exercise(e,i){return `<div class=exercise><b>${esc(e[0])}</b><img src="${img()}"><div class=grid><div><label>Séries</label><input id=s${i} type=number value=${e[1]}></div><div><label>Repetições</label><input id=r${i} value="${e[2]}"></div><div><label>Carga kg</label><input id=k${i} type=number step=.5 placeholder=35></div><div><label>RIR ⓘ</label><input id=q${i} type=number min=0 max=5 placeholder=2></div></div><div class=row><button onclick="saveEx(${i})">Guardar</button><button class=gray onclick="delEx(${i})">Remover</button><button class=alt onclick="alert('RIR = repetições em reserva. RIR 2 significa que, no final da série, ainda conseguirias fazer cerca de 2 repetições com boa técnica.')">O que significa?</button></div></div>`}
function renderTraining(){training.innerHTML=`<h2>🏋️ Treino</h2><div class=card><b>Escolhe o treino de hoje</b><div class=row>${Object.keys(d.workouts).map(x=>`<button class=${sel==x?"":"alt"} onclick="sel='${x}';renderTraining()">${x}</button>`).join("")}</div></div><div class=card><div class=row><h3 style="margin:0">${sel}</h3><button onclick="complete()">Concluir</button></div>${d.workouts[sel].map(exercise).join("")}<button class=alt onclick="addEx()">＋ Adicionar exercício</button></div><div class=card><h3>⏱️ Descanso</h3><div class=timer id=timer>${fmt(sec)}</div><div class=row>${[1,2,3,4].map(n=>`<button onclick="start(${n*60})">${n} min</button>`).join("")}<button class=gray onclick="stop()">Parar</button></div></div><div class=card><h3>🗓️ Calendário</h3><button onclick="markToday()">Marcar hoje</button><div class=calendar>${calendar()}</div></div><div class=card><h3>🧭 Questionário</h3><button onclick="quiz()">Recomendar plano</button></div>`}
function saveEx(i){let e=d.workouts[sel][i];e[1]=+document.getElementById("s"+i).value;e[2]=document.getElementById("r"+i).value;save();alert("Exercício guardado")}
function delEx(i){d.workouts[sel].splice(i,1);save();renderTraining()}
function addEx(){let n=prompt("Nome do exercício");if(n){d.workouts[sel].push([n,3,"8–12"]);save();renderTraining()}}
function complete(){d.history.push({date:new Date().toISOString().slice(0,10),workout:sel});save();alert("Treino registado")}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function start(s){stop();sec=s;renderTraining();timer=setInterval(()=>{sec--;let t=document.getElementById("timer");if(t)t.textContent=fmt(Math.max(0,sec));if(sec<=0){stop();alert("Descanso terminado")}},1000)}
function stop(){if(timer)clearInterval(timer);timer=null}
function calendar(){let n=new Date(),y=n.getFullYear(),m=n.getMonth(),z=new Date(y,m+1,0).getDate(),h="";for(let i=1;i<=z;i++){let x=`${y}-${String(m+1).padStart(2,"0")}-${String(i).padStart(2,"0")}`;h+=`<div class="day ${d.train.includes(x)?"train":""}" onclick="toggle('${x}')">${i}${d.train.includes(x)?" 🏋️":""}</div>`}return h}
function toggle(x){d.train.includes(x)?d.train=d.train.filter(a=>a!=x):d.train.push(x);save();renderTraining()}function markToday(){toggle(new Date().toISOString().slice(0,10))}
function quiz(){let days=+prompt("Quantos dias/semana?","5"),goal=prompt("Objetivo: perder gordura, ganhar músculo ou recomposição?","recomposição");alert(`Com ${days} dias e objetivo de ${goal}, uma estrutura inicial possível é ${days>=5?"PPL + Upper/Lower":days==4?"Upper/Lower":"Full Body"}. Podes editar tudo na app.`)}
function renderNutrition(){let p=d.profile,t=d.meals.reduce((a,x)=>({c:a.c+x.cal,p:a.p+x.p,f:a.f+x.f,h:a.h+x.h}),{c:0,p:0,f:0,h:0});let slots=[["Pequeno-almoço","Weetabix + iogurte grego + whey + fruta",420,35,8,48],["Lanche da manhã","Iogurte proteico + banana + aveia",300,25,7,35],["Almoço","Arroz + frango grelhado + legumes",600,50,12,70],["Lanche da tarde","Pão integral + peru + fruta",350,30,9,40],["Jantar","Salada de massa + frango + ovo",550,48,16,55]];nutrition.innerHTML=`<h2>🍽️ Nutrição</h2><div class=card>${bar("Calorias",t.c,p.cal,"kcal")}${bar("Proteína",t.p,p.protein,"g")}${bar("Gordura",t.f,p.f,"g")}${bar("Hidratos",t.h,p.carbs,"g")}</div><div class=card><h3>Sugestões diárias</h3>${slots.map((s,i)=>`<div style="padding:10px 0;border-bottom:1px solid #e5e7eb"><b>${s[0]}</b><br>${s[1]}<br><small>${s[2]} kcal • P ${s[3]}g • G ${s[4]}g • C ${s[5]}g</small><br><button onclick="reg(${i})">Registar</button></div>`).join("")}</div><div class=card><h3>📸 Foto da refeição</h3><input id=photo type=file accept="image/*" capture="environment"><p class=muted>A interface está preparada para análise por IA. Nesta versão sem backend, a estimativa é confirmada manualmente antes de guardar.</p><button onclick="photoMeal()">Analisar e confirmar</button></div>`}
function bar(n,v,t,u){return `<div style="margin:9px 0"><div><b>${n}</b>: ${Math.round(v)}/${t}${u}</div><div class=progress><div class=bar style="width:${Math.min(100,v/t*100)}%"></div></div></div>`}
function reg(i){let s=[["Pequeno-almoço",420,35,8,48],["Lanche da manhã",300,25,7,35],["Almoço",600,50,12,70],["Lanche da tarde",350,30,9,40],["Jantar",550,48,16,55]][i];d.meals.push({name:s[0],cal:s[1],p:s[2],f:s[3],h:s[4]});save();renderNutrition()}
function photoMeal(){if(!photo.files[0])return alert("Seleciona uma foto.");let n=prompt("Nome da refeição","Refeição"),c=+prompt("Calorias estimadas (confirma antes de guardar)","500"),p=+prompt("Proteína (g)","35"),f=+prompt("Gordura (g)","15"),h=+prompt("Hidratos (g)","50");if(n){d.meals.push({name:n,cal:c,p,f,h});save();renderNutrition();alert("Refeição confirmada.")}}
function renderProgress(){progress.innerHTML=`<h2>📈 Progresso</h2><div class=card><h3>Nova medição</h3><label>Peso</label><input id=w type=number step=.1 value=${d.profile.weight}><label>Cintura</label><input id=wa type=number step=.1 value=${d.profile.waist}><button onclick="measure()">Guardar</button></div><div class=card><h3>Histórico</h3>${d.measure.slice().reverse().map(x=>`<p>${x.date}: <b>${x.weight} kg</b> • ${x.waist} cm</p>`).join("")}</div>`}
function measure(){d.profile.weight=+w.value;d.profile.waist=+wa.value;d.measure.push({date:new Date().toISOString().slice(0,10),weight:d.profile.weight,waist:d.profile.waist});save();renderProgress();renderHome()}
function renderProfile(){let p=d.profile;profile.innerHTML=`<h2>👤 Perfil</h2><div class=card><div class=grid>${field("Nome","n",p.name)}${field("Idade","a",p.age)}${field("Altura","h",p.height)}${field("Peso","pw",p.weight)}${field("Cintura","c",p.waist)}${field("Peso objetivo","tg",p.target)}${field("Cintura objetivo","tc",p.targetWaist)}${field("Calorias/dia","cal",p.cal)}${field("Proteína/dia","pr",p.protein)}${field("Gordura/dia","fa",p.fat)}${field("Hidratos/dia","ca",p.carbs)}</div><button onclick="saveProfile()">Guardar</button></div><div class=card><h3>ℹ️ Glossário</h3><p><b>Repetições:</b> número de movimentos numa série.</p><p><b>Séries:</b> conjuntos de repetições.</p><p><b>RIR:</b> repetições que ainda conseguirias fazer com boa técnica.</p><p><b>Carga:</b> peso usado no exercício.</p><p><b>Volume:</b> quantidade total de trabalho.</p></div>`}
function field(l,i,v){return `<div><label>${l}</label><input id=${i} value="${esc(v)}"></div>`}
function saveProfile(){let p=d.profile;p.name=n.value;p.age=+a.value;p.height=+h.value;p.weight=+pw.value;p.waist=+c.value;p.target=+tg.value;p.targetWaist=+tc.value;p.cal=+cal.value;p.protein=+pr.value;p.fat=+fa.value;p.carbs=+ca.value;save();renderProfile();renderHome()}
function render(s){({home:renderHome,training:renderTraining,nutrition:renderNutrition,progress:renderProgress,profile:renderProfile}[s])()}
nav("home");
</script></body></html>
